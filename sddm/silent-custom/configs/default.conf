; https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 1.0
enable-animations = true
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "alley.jpg"
use-background-color = false
background-color = "#000000"
blur = 32
brightness = 0.0
saturation = 0.0

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "hh:mm"
font-family = "RedHatDisplay"
font-size = 100
font-weight = 900
color = "#FFFFFF"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "RedHatDisplay"
font-size = 16
font-weight = 600
color = "#FFFFFF"
margin-top = -10

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "press any key"
font-family = "RedHatDisplay"
font-size = 16
font-weight = 400
display-icon = true
icon = "enter-key.svg"
icon-size = 24
color = "#FFFFFF"
paint-icon = true
spacing = 0

[LoginScreen]
background = "alley.jpg"
use-background-color = false
background-color = "#000000"
blur = 32
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 140
inactive-size = 100
inactive-opacity = 0.35
active-border-size = 0
inactive-border-size = 0
active-border-color = "#FFFFFF"
inactive-border-color = "#FFFFFF"

[LoginScreen.LoginArea.Username]
font-family = "RedHatDisplay"
font-size = 18
font-weight = 600
color = "#ffffff"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 220
height = 40
display-icon = true
font-family = "RedHatDisplay"
font-size = 16
icon = "password.svg"
icon-size = 20
content-color = "#ffffff"
background-color = "#FFFFFF"
background-opacity = 0.2
border-size = 0
border-color = "#FFFFFF"
border-radius-left = 8
border-radius-right = 8
margin-top = 10
masked-character = "*"

[LoginScreen.LoginArea.LoginButton]
background-color = "#FFFFFF"
background-opacity = 0.2
active-background-color = "#FFFFFF"
active-background-opacity = 0.4
icon = "arrow-right.svg"
icon-size = 20
content-color = "#ffffff"
active-content-color = "#ffffff"
border-size = 0
border-color = "#FFFFFF"
border-radius-left = 8
border-radius-right = 8
margin-left = 4
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "RedHatDisplay"
font-size = 16
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "RedHatDisplay"
font-weight = 600
font-size = 16
icon-size = 40
icon = "spinner.svg"
color = "#FFFFFF"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "RedHatDisplay"
font-size = 11
font-weight = 400
normal-color = "#FFFFFF"
warning-color = "#FFFFFF"
error-color = "#FFFFFF"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 40
border-radius = 8
spacing = 10
font-family = "RedHatDisplay"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 40
item-spacing = 2
padding = 5
display-scrollbar = false
margin = 5
background-color = "#FFFFFF"
background-opacity = 0.2
active-option-background-color = "#FFFFFF"
active-option-background-opacity = 0.4
content-color = "#FFFFFF"
active-content-color = "#FFFFFF"
font-family = "RedHatDisplay"
border-size = 0
border-color = "#FFFFFF"
font-size = 14
icon-size = 20

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 200
background-color = "#FFFFFF"
background-opacity = 0.0
active-background-opacity = 0.2
content-color = "#FFFFFF"
active-content-color = "#FFFFFF"
border-size = 0
font-size = 16
icon-size = 24

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "end"
popup-width = 160
background-color = "#FFFFFF"
background-opacity = 0.0
active-background-opacity = 0.2
content-color = "#FFFFFF"
active-content-color = "#FFFFFF"
border-size = 0
icon = "power.svg"
icon-size = 32

[Tooltips]
enable = true
font-family = "RedHatDisplay"
font-size = 14
content-color = "#FFFFFF"
background-color = "#FFFFFF"
background-opacity = 0.15
border-radius = 5
disable-user = false
disable-login-button = false
